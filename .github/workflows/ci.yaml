name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 9 * * 0"

jobs:
  oxfmt:
    name: Oxfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Oxfmt
        run: npm run format:check
  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    needs:
      - oxfmt
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Oxlint
        run: npm run lint
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs:
      - oxfmt
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check:ci
  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - oxfmt
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - oxlint
      - typecheck
      - test
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build -w structured-data-generators
      - name: Validate package exports
        working-directory: packages/structured-data-generators
        run: |
          npx publint
          npx @arethetypeswrong/cli --pack . --profile esm-only
      - name: Build docs
        run: npm run build -w docs
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
